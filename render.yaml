services:
  - type: web
    name: lpn-scanner
    env: node
    plan: starter  # Or 'standard' for better performance
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: TARGET_URL
        sync: false  # You'll set this in Render dashboard
      - key: TARGET_AUTH_URL
        sync: false
      - key: TARGET_USERNAME
        sync: false
      - key: TARGET_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false  # Will be set to your Render URL
      - key: SESSION_TIMEOUT_MINUTES
        value: 10
